<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
"http://www.w3.org/TR/html4/loose.dtd">
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莲城联合FC俱乐部展览板</title>
<style type="text/css">
*{margin:0;padding:0;box-sizing:border-box;}
body{background-color:#EEEEEE;font-family:"Microsoft YaHei",sans-serif;padding:12px;}
.header-img{width:100%;display:block;margin-bottom:16px;}
.item-card{background:#ffffff;padding:12px;margin-bottom:14px;border-radius:6px;}
.item-img{width:100%;display:block;margin-bottom:10px;}
.item-title{font-size:17px;margin-bottom:12px;}
.download-btn{width:100%;padding:10px;font-size:16px;cursor:pointer;}
.pagination-wrap{margin-top:30px;text-align:center;}
.page-info{font-size:20px;margin-bottom:12px;}
.pagination-controls{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
/* 分页输入框、按钮字号20px，缩小内边距，和page-info字号保持一致 */
.pagination-controls input,
.pagination-controls button {
    font-size: 20px;
    padding: 3px 8px;
}
.copyright-bar{background:#000000;color:#ffffff;font-size:16px;text-align:center;padding:14px 8px;}
</style>
</head>
<body>
<img class="header-img" src="/fcclub/info.png">
<div id="list-container"></div>
<div class="pagination-wrap">
    <div class="page-info" id="pageText">第1页 | 共1页</div>
    <div class="pagination-controls">
        <input type="text" id="pageInput">
        <button id="btnPrev">上一页</button>
        <button id="btnNext">下一页</button>
        <button id="btnFirst">第1页</button>
        <button id="btnLast">第N页</button>
    </div>
</div>
<div class="copyright-bar">莲城联合FC俱乐部展览板 © 2026 丁先生, 保留所有权利.</div>
<script type="text/javascript">
//数据 [图片链接,标题]
var dataList = [
    ['/fcclub/202609181C.JPG', '2026-09-18'],
    ['/fcclub/202609181B.JPG', '2026-09-18'],
    ['/fcclub/202609181A.JPG', '2026-09-18'],
    ['/fcclub/2026091819.JPG', '2026-09-18'],
    ['/fcclub/2026091818.JPG', '2026-09-18'],
    ['/fcclub/2026091817.JPG', '2026-09-18'],
    ['/fcclub/2026091815.JPG', '2026-09-18'],
    ['/fcclub/2026091814.JPG', '2026-09-18'],
    ['/fcclub/2026091813.JPG', '2026-09-18'],
    ['/fcclub/2026091812.JPG', '2026-09-18'],
    ['/fcclub/2026091811.JPG', '2026-09-18'],
    ['/fcclub/2026091810.JPG', '2026-09-18'],
    ['/fcclub/202609180F.JPG', '2026-09-18'],
    ['/fcclub/202609180E.JPG', '2026-09-18'],
    ['/fcclub/202609180D.JPG', '2026-09-18'],
    ['/fcclub/202609180B.JPG', '2026-09-18'],
    ['/fcclub/202609180A.JPG', '2026-09-18'],
    ['/fcclub/2026091809.JPG', '2026-09-18'],
    ['/fcclub/2026091808.JPG', '2026-09-18'],
    ['/fcclub/2026091807.JPG', '2026-09-18'],
    ['/fcclub/2026091806.JPG', '2026-09-18'],
    ['/fcclub/2026091805.JPG', '2026-09-18'],
    ['/fcclub/2026091804.JPG', '2026-09-18'],
    ['/fcclub/2026091803.JPG', '2026-09-18'],
    ['/fcclub/2026091802.JPG', '2026-09-18'],
    ['/fcclub/2026091801.JPG', '2026-09-18'],
    ['/fcclub/2026091800.JPG', '2026-09-18'],
    ["/fcclub/DSC_0915.JPG", "2026-09-13 滕少达的精彩表现"],
    ["/fcclub/DSC_0914.JPG", "2026-09-13 滕少达的精彩表现"],
    ["/fcclub/DSC_0913.JPG", "2026-09-13 滕少达的精彩表现"],
    ["/fcclub/DSC_0912.JPG", "2026-09-13 滕少达的精彩表现"],
    ["/fcclub/DSC_0911.JPG", "2026-09-13 滕少达的精彩表现"],
    ["/fcclub/DSC_0907.JPG", "2026-09-13 滕少达的精彩表现"]
];
var pageSize = 20;
var currentPage = 1;
var totalPage = Math.ceil(dataList.length / pageSize);
var listContainer = document.getElementById("list-container");
var pageText = document.getElementById("pageText");
var pageInput = document.getElementById("pageInput");
var btnPrev = document.getElementById("btnPrev");
var btnNext = document.getElementById("btnNext");
var btnFirst = document.getElementById("btnFirst");
var btnLast = document.getElementById("btnLast");

//标记是否是首次页面加载
var isFirstLoad = true;

function render(){
    totalPage = Math.ceil(dataList.length / pageSize);
    listContainer.innerHTML = "";
    var start = (currentPage - 1) * pageSize;
    var end = start + pageSize;
    var slice = dataList.slice(start, end);
    for(var i = 0; i < slice.length; i++){
        var item = slice[i];
        var div = document.createElement("div");
        div.className = "item-card";
        div.innerHTML = '<img class="item-img" src="'+item[0]+'" alt="">'
            +'<div class="item-title">'+item[1]+'</div>'
            +'<button class="download-btn" data-link="'+item[0]+'">下载</button>';
        listContainer.appendChild(div);
    }
    pageText.innerText = "第"+currentPage+"页 | 共"+totalPage+"页";
    btnLast.innerText = "第"+totalPage+"页";
    pageInput.value = currentPage;
    //按钮禁用逻辑
    btnPrev.disabled = (currentPage === 1);
    btnFirst.disabled = (currentPage === 1);
    btnNext.disabled = (currentPage === totalPage);
    btnLast.disabled = (currentPage === totalPage);
    //下载事件绑定
    var btns = document.querySelectorAll(".download-btn");
    for(var j=0;j<btns.length;j++){
        btns[j].onclick = function(){
            var link = this.getAttribute("data-link");
            var a = document.createElement("a");
            a.href = link;
            a.setAttribute("download","");
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }
    // 修复：只在非首次加载（翻页的时候）才滚动到顶部，刚打开页面不触发滚动
    if(!isFirstLoad){
        window.scrollTo({top:0,behavior:"smooth"});
    }else{
        isFirstLoad = false;
    }
}
function goPage(p){
    var target = parseInt(p,10);
    if(isNaN(target) || target <1 || target > totalPage){
        pageInput.value = currentPage;
        return;
    }
    currentPage = target;
    render();
}
btnPrev.onclick = function(){goPage(currentPage-1);};
btnNext.onclick = function(){goPage(currentPage+1);};
btnFirst.onclick = function(){goPage(1);};
btnLast.onclick = function(){goPage(totalPage);};
pageInput.onchange = function(){goPage(this.value);};
render();
</script>
</body>
</html>
